# ts-forecaster configuration template: every setting with its default.
# Copy this file, keep the sections/keys you want to change and delete the rest
# (anything left out uses the default). Run it with
#     python run.py --config my_config.yaml
# Options given on the command line override the file. Generated by
# tools/make_config_template.py from the option help texts.

run:
  # What to run and where results go.
  # What run.py does: train, tune (search, then train the final model), evaluate (a saved
  # model) or explain (SHAP). Default: train.
  mode: train
  # Name of the experiment, or run.name in --config. Used for the default output folder.
  name: my_experiment
  # Folder for everything the run writes; several runs can share it. Default:
  # outputs/<testname>.
  output_dir: null
  # Repeat number of this run; the random seed is 42 + test-num. Default: None (seed 42).
  test_num: null
  # Save the trained model to <output-dir>/models/ (True or False). Default: True.
  save_model: true
  # True: train a new model. False: evaluate the model in --trainedModelFile. Default:
  # True.
  train: true
  # Saved model folder to evaluate when --train False.
  trained_model: null
  # Hide Python warnings (True or False). Default: False.
  suppress_warnings: false

data:
  # Input file and the forecasting task.
  # Input data file (parquet, CSV or TSV), or data.file in --config.
  file: data/air_quality/Nongzhanguan.parquet
  # Name of the time column. Default: Date.
  date_column: Date
  # Every column whose name contains this text is a target. Default: _Label.
  label_tag: _Label
  # Input sequence length: how many timesteps (Hours or Days) of data to use for
  # prediction
  input_length: 24
  # Output sequence length: how many timesteps (Hours or Days) of data to predict
  output_length: 2
  # Output sequence offset (default: 0): how many timesteps (Hours or Days) to offset the
  # output sequence from the input sequence. E.g. for one prediction 12 timesteps ahead
  # set output-offset to 12 and output-length to 1.
  output_offset: 0
  # Fraction of the rows, from the start, used for training. Default: 0.7.
  train_ratio: 0.7
  # Fraction of the rows after the training period used for validation. Default: 0.15.
  val_ratio: 0.15
  # Fraction of the rows at the end used for testing; the three ratios must sum to 1.
  # Default: 0.15.
  test_ratio: 0.15
  # Calendar input features, comma-separated: time_of_day, day_of_year, day_of_week,
  # trend; or auto or none. Default: auto (day_of_year, plus time_of_day for sub-daily
  # data and trend when --trend-period-years > 0).
  time_features: auto
  # Period in years of the 'Year sin/cos' trend features; 0 leaves them out. Default: 0.
  trend_period_years: 0
  # Signed-log change input features: for every target and lag k, sign(d)*log1p(|d|/s)
  # with d = the change over the last k steps and s = the median absolute 1-step change on
  # the training period. Computed from the raw values before gap filling and scaling.
  # Comma-separated lags, or none to turn all change features off (including --change-
  # columns). Default: 1,3,6.
  change_lags: 1,3,6
  # Regular expressions (comma-separated) of other input columns that also get a 1-step
  # signed-log change feature, e.g. '-HG-' for the river stage of the GRWS data. Default:
  # None.
  change_columns: null
  # What the model outputs for each target: change (from the last observed value), level,
  # or both (two heads, scored separately). Default: change.
  predict: change

preprocessing:
  # Gap filling, scaling and oversampling (fitted on the training period only).
  # How gaps (NaN) are filled, fitted on the training period. Options: ffill, zero, mean,
  # median, median_mask, min_std, min_std_2, min_std_4, interpolate, interpolate_time,
  # interpolate_polynomial, interpolate_spline, mean_previous_next, rolling_mean_6,
  # rolling_mean_12, rolling_mean_24, knn, mice, kalman, missforest,
  # missforest_singleton_minstd, kalman_singleton_minstd, none. Default: min_std (training
  # minimum - training std, so gaps stand out from observed values; see README).
  nan_fill: min_std
  # How each column is scaled, fitted on the training period. Options: none, standard,
  # minmax, robust, maxabs, quantile, power. Default: minmax.
  transform_method: minmax
  # Oversample the data by duplicating rows where the label is greater than the threshold.
  # Default is None, values must be between 0.5 and 1. If set, provide a list of floats
  # separated by commas. For example: 0.75,0.9,0.99
  oversample_high_thresholds: null
  # Oversample the data by duplicating rows where the label is lower than the threshold.
  # Default is None, values must be between 0 and 0.5. If set, provide a list of floats
  # separated by commas. For example: 0.25,0.1,0.01
  oversample_low_thresholds: null

model:
  # Model architecture.
  # Model architecture, a name in model.MODEL_BUILDERS. Default: lstm.
  model_type: lstm
  # False: one Dense layer maps the last LSTM state to all output steps. True: encoder-
  # decoder LSTM. Default: False.
  decoder: false
  # Number of stacked LSTM layers (minimum 1). Default: 2.
  num_layers: 2
  # Units per LSTM layer. Default: 512.
  units_per_layer: 512
  # Dropout between LSTM layers and before the output layer. Default: 0.4.
  dropout_rate: 0.4
  # Dropout on the input features. Default: 0.
  input_dropout: 0.0
  # Std of Gaussian noise added to non-zero scaled inputs during training; 0 disables it.
  # Default: 0.0.
  noise: 0.0
  # Kernel initializer of the LSTM and output layers: zeros, ones, random_normal,
  # random_uniform, glorot_normal, glorot_uniform, he_normal, he_uniform. Default:
  # glorot_uniform.
  weight_init: glorot_uniform
  # Add LayerNormalization (not BatchNormalization) after every LSTM layer except the last
  # (True or False). Default: False.
  batch_normalization: false
  # L1 penalty on the LSTM input kernels (e.g. 1e-6). Default: None (off).
  l1_regularization: null
  # L2 penalty on the LSTM input kernels (e.g. 1e-6). Default: None (off).
  l2_regularization: null
  # L1 penalty on the LSTM recurrent kernels (e.g. 1e-6). Default: None (off).
  l1_recurrent_regularization: null
  # L2 penalty on the LSTM recurrent kernels (e.g. 1e-6). Default: None (off).
  l2_recurrent_regularization: null
  # L1 penalty on the output layer kernel (e.g. 1e-6). Default: None (off).
  l1_dense_regularization: null
  # L2 penalty on the output layer kernel (e.g. 1e-6). Default: None (off).
  l2_dense_regularization: null

training:
  # Optimisation and hardware.
  # Loss function to use. Default is mse. Options are: mse, mae, mape, huber, nse, kge.
  # Note that KGE and NSE are actually (1 - KGE) and (1 - NSE) respectively (i.e. lower is
  # better).
  loss_function: mse
  # Adam learning rate; -1 uses a triangular cyclical schedule (0.0005 to 0.005). Default:
  # None (Adam's default, 0.001).
  learning_rate: null
  # Training batch size (multiplied by the number of GPUs with --mirrored True). Default:
  # 32.
  batch_size: 32
  # Maximum number of training epochs. Default: 60.
  max_epochs: 60
  # No early stopping before this epoch. Default: 10.
  min_epochs: 10
  # Stop training when --patience-metric has not improved for this many epochs after
  # --min-epochs; -1 disables early stopping. Default: -1.
  patience: -1
  # Validation metric for early stopping and the best epoch: val_loss, val_mse, val_mae,
  # val_mape, val_rmse or val_nse. Default: val_loss.
  patience_metric: val_loss
  # Clip gradients to this global norm (e.g. 1.0). Default: None (no clipping).
  gradient_clip: null
  # Train in mixed precision (float16 compute, float32 weights): auto, True or False.
  # Default: auto (on when a GPU is found).
  half_float: auto
  # Use deterministic TensorFlow ops, so runs with the same --test-num give identical
  # results (True or False). Default: False.
  deterministic: false
  # Use MirroredStrategy when more than one GPU is visible; the batch size is multiplied
  # by the number of GPUs (True or False). Default: False.
  mirrored: false
  # Number of runs sharing one GPU; > 1 enables GPU memory growth. Default: 1.
  num_gpu_splits: 1
  # Index of this run among the runs sharing a GPU, also used in the Optuna database name.
  # Default: 0.
  cur_gpu_split: 0

evaluation:
  # Scores written to results.csv.
  # Metric groups written to results.csv, comma-separated: core, hydrology, peaks,
  # relative, or all. Default: core.
  metrics: core
  # Season length in time steps for a seasonal-naive reference forecast (e.g. 24 for
  # hourly data); 0 disables it. Default: 0.
  seasonal_period: 0

tuning:
  # Optuna hyperparameter search (run.py --mode tune).
  # Run an Optuna search with this many trials instead of one training run. Default: None
  # (off).
  trials: null
  # JSON file with the Optuna search space (see search_space.py). Default:
  # configs/optuna_search_space.json.
  search_space: configs/optuna_search_space.json
  # Number of times each Optuna trial is trained, with different seeds. Default: 1.
  repeats: 1
  # How the repeats of a trial are combined into its score: worst, median, mean, best,
  # better_midrank, worse_midrank. Default: worst.
  repeat_method: worst
  # Number of Optuna trials run in parallel in this process. Default: 1.
  n_jobs: 1
  # Directory for the Optuna database; a shared directory must already exist. Default:
  # <output-dir>/optuna.
  db_dir: null
  # Stop starting new Optuna trials after this many seconds. Default: None (no limit).
  timeout: null
  # run.py --mode tune: number of final models trained with the best settings. Default: 1.
  final_repeats: 1

explain:
  # SHAP explanations of a saved model (run.py --mode explain / shap_explain.py).
  # Compute SHAP values. Default: False.
  run_shap: false
  # Comma-separated sample modes: random, high_flow, low_flow. Default: random.
  shap_sample_mode: random
  # Comma-separated quantiles of the target, used only for high_flow mode, e.g. 0.9,0.95.
  # Default: 0.9.
  shap_flow_quantile: '0.9'
  # Comma-separated quantiles of the target, used only for low_flow mode, e.g. 0.1,0.05.
  # Default: 0.1.
  shap_lowflow_quantile: '0.1'
  # Comma-separated 1-indexed output horizons, e.g. 1,6,12. Default: 1.
  shap_horizon: '1'
  # Index of the target column to explain (see label_columns.json). Default: 0.
  shap_label_index: 0
  # Seed for drawing the background and explained windows. Default: 123.
  shap_seed: 123
  # Training batches scanned for the SHAP background windows. Default: 4.
  shap_background_batches: 4
  # Background windows drawn from those batches. Default: 16.
  shap_background_size: 16
  # Test batches scanned for the explained windows (random mode only). Default: 4.
  shap_explain_batches: 4
  # Test windows explained per run. Default: 32.
  shap_explain_size: 32
  # Start of the focus window of the member lag plot and category table, in input steps
  # back from the newest (0). Default: 0.
  shap_focus_window_start: 0
  # End (exclusive) of that focus window, clipped to --input-length. Default: 48.
  shap_focus_window_end: 48
  # Ordered mapping {group: [patterns]} as YAML/JSON text or file; a pattern is a
  # substring of the column name or 're:<regex>', first match wins. Default: calendar
  # columns -> time, targets -> target, else the text after the last '_'.
  feature_groups: null
  # Group whose columns are also analysed per member, e.g. dam. Default: none.
  member_group: null
  # Regex whose group 1 is the member name of a column. Default: ^([^-]+), the text before
  # the first '-'.
  member_pattern: ^([^-]+)
  # Regex whose group 1 is the sub-type of a column, e.g. '-([A-Z]{2})-\d+' for SHEF
  # codes. Default: none.
  type_pattern: null
  # CSV (columns pattern,category) assigning member columns to categories; first match
  # wins, unmatched columns are left out. Default: the sub-type, or 'all'.
  member_categories: null
  # Evaluate the model on the test period (checkpoint_test_metrics.csv). Default: True.
  run_prediction_test: true
  # Also run predictor_main.test(), which appends to results.csv (only with --run-
  # prediction-test). Default: True.
  run_original_test: true
  # Test batches saved as x/y_test_scaled_sample.npy. Default: 4.
  max_test_batches_for_cache: 4
  # Path to model checkpoint weights. Can include or omit suffixes like .index or
  # .data-00000-of-00001.
  checkpoint: null
